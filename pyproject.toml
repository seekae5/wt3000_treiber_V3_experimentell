# NEU (Punkt 4, src-Layout): ersetzt die pyproject.toml aus dem Build/-Skelett.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wt3000-scpi"
version = "0.3.0"
description = "SCPI-Treiber fuer das Yokogawa WT3000 (tmctl/Ethernet)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Die Testsuite braucht kein Geraet und keine tmctl.dll.
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/wt3000_scpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
